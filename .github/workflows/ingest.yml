name: Ingest Loveworld Songs

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max songs to ingest (0 = unlimited)'
        required: false
        default: '0'

jobs:
  ingest:
    name: Fingerprint & Index Songs
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DATABASE_URL:     ${{ secrets.DATABASE_URL }}
      REDIS_URL:        ${{ secrets.REDIS_URL }}
      R2_ACCOUNT_ID:    ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_KEY:    ${{ secrets.R2_SECRET_KEY }}
      R2_BUCKET_NAME:   ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL:    ${{ secrets.R2_PUBLIC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run ingest
        run: python -m app.ingest --limit "${{ github.event.inputs.limit }}"
